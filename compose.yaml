services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trustvault}
      POSTGRES_USER: ${POSTGRES_USER:-trustvault_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - trustvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustvault_app} -d ${POSTGRES_DB:-trustvault}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trustvault-postgres:
