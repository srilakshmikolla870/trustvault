spring:
  application:
    name: trustvault-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trustvault}
    username: ${DB_USERNAME:trustvault_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
trustvault:
  storage:
    directory: ${TRUSTVAULT_STORAGE_DIR:./var/private-documents}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
      timeout: 30m
