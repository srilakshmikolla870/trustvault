spring:
  application:
    name: trustvault-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trustvault}}
    username: ${DB_USERNAME:trustvault_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trustvault}}}
    user: ${FLYWAY_USERNAME:${DB_USERNAME:trustvault_app}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
trustvault:
  storage:
    mode: ${TRUSTVAULT_STORAGE_MODE:filesystem}
    directory: ${TRUSTVAULT_STORAGE_DIR:./var/private-documents}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
      timeout: 30m
